<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A premium Spotify-like music player with glassmorphic design.">
    <title>Spotify - Web Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="logo">
                <i class="fab fa-spotify"></i>
                <span>Spotify</span>
            </div>
            <ul class="nav-links">
                <li class="active"><i class="fas fa-home"></i> <span>Home</span></li>
                <li><i class="fas fa-search"></i> <span>Search</span></li>
                <li><i class="fas fa-book"></i> <span>Your Library</span></li>
            </ul>
            <div class="playlist-section">
                <div class="section-title">Playlists</div>
                <ul class="playlist-links">
                    <li><i class="fas fa-plus-square"></i> <span>Create Playlist</span></li>
                    <li><i class="fas fa-heart"></i> <span>Liked Songs</span></li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content" id="main-content">
            <header class="top-nav">
                <div class="nav-arrows">
                    <button id="prev-page"><i class="fas fa-chevron-left"></i></button>
                    <button id="next-page"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="user-profile">
                    <button class="upgrade-btn">Upgrade</button>
                    <div class="profile-badge">
                        <i class="fas fa-user"></i>
                        <span>User</span>
                    </div>
                </div>
            </header>

            <section class="hero-section">
                <div class="greeting" id="greeting">Good Morning</div>
                <div class="quick-links" id="quick-links">
                    <!-- Quick links will be populated by JS -->
                </div>
            </section>

            <section class="song-list-container">
                <div class="section-header">
                    <h2>Your Top Tracks</h2>
                    <span>Show all</span>
                </div>
                <div class="song-grid" id="song-grid">
                    <!-- Songs will be populated by JS -->
                </div>
            </section>
        </main>

        <!-- Music Player Bar -->
        <footer class="player-bar" id="player-bar">
            <div class="current-track">
                <img src="" alt="Album Art" id="player-art" class="hidden">
                <div class="track-info">
                    <div class="track-name" id="player-track-name">No track selected</div>
                    <div class="track-artist" id="player-track-artist">Select a song to start</div>
                </div>
                <button class="like-btn"><i class="far fa-heart"></i></button>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button id="shuffle-btn"><i class="fas fa-shuffle"></i></button>
                    <button id="prev-btn"><i class="fas fa-backward-step"></i></button>
                    <button id="play-pause-btn" class="play-btn"><i class="fas fa-play"></i></button>
                    <button id="next-btn"><i class="fas fa-forward-step"></i></button>
                    <button id="repeat-btn"><i class="fas fa-repeat"></i></button>
                </div>
                <div class="progress-container">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" value="0">
                    <span id="total-time">0:00</span>
                </div>
            </div>

            <div class="volume-controls">
                <button id="lyrics-btn"><i class="fas fa-microphone"></i></button>
                <button id="queue-btn"><i class="fas fa-list"></i></button>
                <button id="device-btn"><i class="fas fa-laptop"></i></button>
                <div class="volume-slider">
                    <i class="fas fa-volume-high" id="volume-icon"></i>
                    <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
